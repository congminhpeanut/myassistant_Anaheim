<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Anaheim Travel Guide — ADLM 2026</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root{--bg:#0f172a;--card:#1e293b;--elev:#27354d;--accent:#0ea5e9;--accent2:#10b981;--text:#e2e8f0;--mute:#94a3b8;--border:#334155;--danger:#ef4444;--warning:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}

.header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);padding:18px 16px 14px;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:20px;font-weight:700;color:#fff;line-height:1.3;letter-spacing:-.3px}
.header h1 span{display:block;font-size:13px;font-weight:400;color:#94a3b8;margin-top:4px;line-height:1.4}
.lang-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:8px;color:#e2e8f0;font-size:12px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.lang-btn:active{background:rgba(255,255,255,.15)}

.main{flex:1;overflow-y:auto;padding:12px 14px 90px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;position:relative}
.card.priority-high{border-left:4px solid var(--accent)}
.card.priority-med{border-left:4px solid var(--warning)}
.card.priority-red{border-left:4px solid var(--danger)}
.card h2{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;font-weight:600}
.card h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:8px;line-height:1.4}
.card h4{font-size:14px;font-weight:500;color:#e2e8f0;margin:10px 0 4px}
.card p{font-size:13px;color:#cbd5e1;line-height:1.65;margin-bottom:8px}
.card p strong{color:#fff;font-weight:500}
.card ul{padding-left:18px;margin:8px 0;font-size:13px;color:#cbd5e1;line-height:1.7}
.card li{margin-bottom:4px}

.tag{display:inline-flex;align-items:center;background:var(--elev);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;color:#94a3b8;margin:0 4px 6px 0}
.tag.highlight{border-color:var(--accent);color:var(--accent);background:rgba(14,165,233,.08)}
.tag.green{border-color:var(--accent2);color:var(--accent2);background:rgba(16,185,129,.08)}
.tag.red{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,.08)}
.tag.orange{border-color:var(--warning);color:var(--warning);background:rgba(245,158,11,.08)}

.badge{display:inline-block;background:var(--accent);color:#0f172a;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:8px}

.row{display:flex;gap:10px;margin-bottom:10px}
.col{flex:1}

.collapse-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 0;border-top:1px solid var(--border)}
.collapse-header:first-child{border-top:none}
.collapse-header h4{font-size:13px;color:#fff;font-weight:500}
.collapse-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.collapse-body.open{max-height:2500px}
.arrow{font-size:11px;color:#94a3b8;transition:transform .2s}
.arrow.open{transform:rotate(180deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px;margin-right:6px}
.btn-primary{background:var(--accent);color:#0f172a}
.btn-accent{background:var(--accent2);color:#0f172a}
.btn-outline{background:transparent;border:1px solid var(--border);color:#cbd5e1}
.btn-sm{padding:7px 12px;font-size:12px}

.map{border-radius:12px;overflow:hidden;background:var(--elev);border:1px solid var(--border);margin:10px 0}
.map iframe{width:100%;height:220px;border:none;display:block}

.list-item{padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item h4{font-size:13px;color:#fff;margin-bottom:4px;font-weight:500}
.list-item p{font-size:12px;color:#94a3b8;margin-bottom:3px;line-height:1.5}
.step-list{padding-left:20px;margin:8px 0}
.step-list li{font-size:12px;color:#cbd5e1;line-height:1.7;margin-bottom:6px}
.step-list li::marker{color:var(--accent)}

.time-badge{background:rgba(245,158,11,.12);border:1px solid var(--warning);color:var(--warning);border-radius:6px;padding:3px 8px;font-size:11px;margin-right:6px}

.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:4px 0;z-index:50}
.tab{flex:1;text-align:center;padding:6px 0;background:none;border:none;color:var(--mute);font-size:10px;cursor:pointer;transition:color .2s}
.tab.active{color:var(--accent)}
.tab svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:currentColor;opacity:.7;transition:opacity .2s}
.tab.active svg{opacity:1}

#loader{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#loader .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
#loader p{font-size:13px;color:var(--mute);margin-top:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.bilingual .vi-show,.bilingual .vi-show-inline{display:none}
.bilingual.vietnamese .en-show{display:none !important}
.bilingual.vietnamese .vi-show{display:block}
.bilingual.vietnamese .vi-show-inline{display:inline !important}

.hint{font-size:11px;color:#64748b;margin-top:4px}
a.link{color:var(--accent);text-decoration:none;font-size:13px}
a.link:hover{text-decoration:underline}

/* ---------- CHATBOT ---------- */
.chat-fab{position:fixed;bottom:76px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#0284c7);color:#fff;border:none;box-shadow:0 4px 14px rgba(14,165,233,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;font-size:24px;transition:transform .2s,box-shadow .2s}
.chat-fab:active{transform:scale(.92)}
.chat-fab .badge-new{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;display:none}
.chat-panel{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:70;display:none;flex-direction:column;height:70vh;max-height:600px;box-shadow:0 -8px 30px rgba(0,0,0,.5);animation:slideUp .3s ease}
.chat-panel.open{display:flex}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,var(--elev),var(--card))}
.chat-header h3{font-size:15px;color:#fff;font-weight:600}
.chat-header .close-btn{background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:0 4px}
.chat-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-wrap:break-word;animation:popIn .2s ease}
.chat-bubble.user{align-self:flex-end;background:var(--accent);color:#0f172a;border-bottom-right-radius:4px}
.chat-bubble.bot{align-self:flex-start;background:var(--elev);color:#e2e8f0;border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-bubble.bot a{color:var(--accent);text-decoration:underline}
.chat-bubble.bot strong{color:#fff}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.chat-input-wrap{display:flex;align-items:center;gap:8px;padding:10px 14px 18px;border-top:1px solid var(--border);background:var(--card)}
.chat-input-wrap input{flex:1;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:#fff;font-size:13px;outline:none}
.chat-input-wrap input::placeholder{color:#64748b}
.chat-input-wrap button{background:var(--accent);color:#0f172a;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chat-input-wrap button:disabled{opacity:.5;cursor:not-allowed}
.chat-quick{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.chat-quick button{white-space:nowrap;background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:6px 12px;color:#cbd5e1;font-size:11px;cursor:pointer}
.chat-quick button:active{background:rgba(255,255,255,.06)}
.chat-status{font-size:11px;color:#64748b;padding:0 14px 6px}
.chat-status.gps{color:var(--accent2)}
.chat-status.gps-err{color:var(--danger)}

/* Overlay backdrop */
.chat-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:65;display:none}
.chat-backdrop.open{display:block}

/* Lost button special */
.lost-btn{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;border:none}
</style>
</head>

</div>

<script>
let DATA = {};
let LANG = 'en';
let CHAT_HISTORY = [];
let GPS_LAT = null;
let GPS_LON = null;
let GPS_ACCURACY = null;

const UI = {
  en: {
    loading: "Loading travel guide...", openMaps: "Open in Google Maps", getDirections: "Get Directions",
    arriveEarly: "Arrive early (6:15). Lines form fast.", bestFor: "Best for", fromSNA: "From SNA", fromLAX: "From LAX",
    pros: "Pros", cons: "Cons", recommended: "Recommended", tips: "Tips", emergency: "EMERGENCY CALL",
    call: "Call", morning: "Morning", afternoon: "Afternoon", evening: "Evening", budget: "Est. Budget",
    perDay: "per day", forTwo: "for 2 people", viewMaps: "View on Maps", venue: "Venue", expo: "Expo",

    whyStay: "Why stay here", usefulLinks: "Useful Links", safetyTips: "Safety Tips", whatToDo: "Things to Do",
    fullSchedule: "Full Schedule", arrivalTips: "Arrival Guide", transportOptions: "Transport Options",
    whereToStay: "Where to Stay", keyEvents: "Key Events", cost: "Cost", steps: "Steps", openMixer: "Opening Mixer",
    expoDays: "Expo Days", dayPlan: "Daily Plan", dayByDay: "Day-by-Day Itinerary", restaurants: "Restaurants",
    activities: "Activities", littleSaigon: "Little Saigon", conventionFood: "Convention Center Food",
    chatPlaceholder: "Ask anything about Anaheim...",
    chatSend: "Send", chatLost: "I'm lost", chatHotel: "Hotel", chatFood: "Food near me",
    chatAirport: "To airport", chatVenue: "To venue", chatEmergency: "Emergency",
    gpsAcquiring: "Acquiring GPS...", gpsReady: "GPS ready", gpsError: "GPS unavailable",
    typing: "Typing...", navTo: "Navigate to", openGoogleMaps: "Open Google Maps",
    transportFrom: "Transport from here", byTransit: "Transit (real-time)", toPlace: "To",
    detail: "Detail", venuePlaces: "Venue", airportPlaces: "Airports", foodPlaces: "Food",
    activityPlaces: "Activities", hotelPlaces: "Other hotels", emergencyPlaces: "Emergency",
    pharmacyPlaces: "Pharmacy", noConnections: "No connections found."
  },
  vi: {
    loading: "Đang tải...", openMaps: "Mở trong Google Maps", getDirections: "Chỉ đường",
    arriveEarly: "Đến sớm (6:15 giờ). Có đông người nhanh.", bestFor: "Phù hợp", fromSNA: "Từ SNA", fromLAX: "Từ LAX",
    pros: "Ưu điểm", cons: "Nhược điểm", recommended: "Đề xuất", tips: "Lưu ý", emergency: "GỌI KHẨN CẤP",
    call: "Gọi", morning: "Buổi sáng", afternoon: "Buổi chiều", evening: "Buổi tối", budget: "Ngân sách ước tính",
    perDay: "mỗi ngày", forTwo: "cho 2 người", viewMaps: "Xem trên Bản đồ", venue: "Địa điểm", expo: "Triển lãm",
    poster: "Vị trí Poster", dates: "Ngày", address: "Địa chỉ", phone: "Điện thoại", distance: "Khoảng cách",
    whyStay: "Tại sao nên ở đây", usefulLinks: "Liên kết hữu ích", safetyTips: "Lưu ý an toàn", whatToDo: "Hoạt động",
    fullSchedule: "Lịch toàn bộ", arrivalTips: "Hướng dẫn đến nơi", transportOptions: "Phương tiện di chuyển",
    whereToStay: "Nơi ở", keyEvents: "Sự kiện chính", cost: "Chi phí", steps: "Các bước", openMixer: "Tiệc chào đón",
    expoDays: "Ngày Triển lãm", dayPlan: "Lịch từng ngày", dayByDay: "Lịch trình chi tiết", restaurants: "Nhà hàng",
    activities: "Nơi vui chơi", littleSaigon: "Little Saigon", conventionFood: "Ăn trong Trung tâm Hội nghị",
    chatPlaceholder: "Hỏi bất cứ điều gì về Anaheim...",
    chatSend: "Gửi", chatLost: "Tôi bị lạc", chatHotel: "Khách sạn", chatFood: "Ăn gần đây",
    chatAirport: "Ra sân bay", chatVenue: "Đến hội nghị", chatEmergency: "Khẩn cấp",
    gpsAcquiring: "Đang lấy GPS...", gpsReady: "GPS sẵn sàng", gpsError: "GPS không khả dụng",
    typing: "Đang trả lời...", navTo: "Chỉ đường đến", openGoogleMaps: "Mở Google Maps",
    transportFrom: "Phương tiện từ đây", byTransit: "Xe công cộng (thời gian thực)", toPlace: "Đến",
    detail: "Chi tiết", venuePlaces: "Hội nghị", airportPlaces: "Sân bay", foodPlaces: "Ăn uống",
    activityPlaces: "Vui chơi", hotelPlaces: "Khách sạn khác", emergencyPlaces: "Khẩn cấp",
    pharmacyPlaces: "Nhà thuốc", noConnections: "Không tìm thấy kết nối."
  }
};

function T(key){
  if(key && typeof key === 'object' && key.en) { return key[LANG] || key.en; }
  return (UI[LANG] && UI[LANG][key]) || key;
}

function toggleLang(){
  LANG = LANG === 'en' ? 'vi' : 'en';
  document.body.classList.toggle('vietnamese', LANG === 'vi');
  localStorage.setItem('anaheim_lang', LANG);
  renderAll();
  updateChatUI();
}

async function loadAll(){
  const stored = localStorage.getItem('anaheim_lang');
  if(stored){ LANG = stored; document.body.classList.toggle('vietnamese', LANG==='vi'); }

  const endpoints = ['overview','airport','transport','hotels','schedule','food','emergency','activities','daily-plan','links'];
  for(const ep of endpoints){
    try{ const r=await fetch('/api/'+ep); if(r.ok) DATA[ep] = await r.json(); }
    catch(e){}
  }
  document.getElementById('loader').style.display='none';
  renderAll();
  initChat();
  acquireGPS();
}

function renderAll(){ renderGuide(); renderPlan(); renderMaps(); renderFood(); renderMore(); }

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function toggleCollapse(el){
  const body = el.querySelector('.collapse-body');
  const arrow = el.querySelector('.arrow');
  const open = body.classList.toggle('open');
  if(arrow) arrow.classList.toggle('open',open);
}

function linkMap(addr){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr); }
function linkDir(dest){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest); }

/* ---------- GUIDE ---------- */
function renderGuide(){
  const o=DATA.overview||{};
  const a=DATA.airport||{};
  const h=DATA.hotels||[];
  const e=DATA.emergency||{};
  let html = '';

  html += `
    <div class="card">
      <div class="badge">${T('recommended')}</div>
      <h2>${T('venue')}</h2>
      <h3>${T(o.event)}</h3>
      <p><strong>${T('venue')}:</strong> ${T(o.venue)} &mdash; ${o.address}</p>
      <p><strong>${T('dates')}:</strong> ${T(o.dates)} (${T('expo')}: ${T(o.expo_dates)})</p>
      <p><strong>${T('poster')}:</strong> ${T(o.poster_location)}</p>
      <div>
        <span class="tag">${o.travelers} ${T('forTwo')}</span>
        <span class="tag highlight">${T(o.budget_per_day)}</span>
        <span class="tag green">${T(o.your_arrival)}</span>
      </div>
      <a class="btn btn-primary" href="${linkDir(o.address)}" target="_blank">${T('getDirections')}</a>
    </div>
  `;

  const rec = a.recommended_airport || {};
  const alt = a.alternative_airport || {};
  html += `
    <div class="card">
      <h2>${T('arrivalTips')}</h2>
      <div style="background:rgba(16,185,129,.1);border:1px solid var(--accent2);border-radius:10px;padding:12px;margin-bottom:12px">
        <h3 style="color:var(--accent2)">${T(rec.name)} (${rec.code})</h3>
        <p>${T(rec.drive_time)} &middot; ${T(rec.distance_to_venue)}</p>

function renderMarkdown(text){
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  h = h.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  h = h.replace(/^\s*[-\*]\s+(.*$)/gim, '<li>$1</li>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

}

function acquireGPS(){
  setGPSStatus(T('gpsAcquiring'));
  if(!navigator.geolocation){
    setGPSStatus(T('gpsError'), true);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      GPS_LAT = pos.coords.latitude;
      GPS_LON = pos.coords.longitude;
      GPS_ACCURACY = pos.coords.accuracy;
      setGPSStatus(`${T('gpsReady')} (±${Math.round(GPS_ACCURACY)}m)`);
    },
    err=>{
      setGPSStatus(T('gpsError'), true);
      console.error('GPS error', err);
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:30000}
  );
  // Keep watching for real-time updates
  navigator.geolocation.watchPosition(
    pos=>{
      GPS_LAT = pos.coords.latitude;
      GPS_LON = pos.coords.longitude;
      GPS_ACCURACY = pos.coords.accuracy;
      setGPSStatus(`${T('gpsReady')} (±${Math.round(GPS_ACCURACY)}m)`);
    },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:10000}
  );
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addUserMessage(text);
  CHAT_HISTORY.push({role:'user', content:text});
  setTyping(true);
  
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-bubble bot';
  div.textContent = '';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  
  let fullReply = '';
  let buffer = '';
  
  try{
    const r = await fetch('/api/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:text, history:CHAT_HISTORY.slice(-6)})
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      let nl;
      while((nl = buffer.indexOf('\n')) >= 0){
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if(!line) continue;
        try{
          const parsed = JSON.parse(line);
          if(parsed.token){
            fullReply += parsed.token;
            div.textContent = fullReply;
            box.scrollTop = box.scrollHeight;
          }
        }catch(e){}
      }
    }
    // Final markdown render
    div.innerHTML = renderMarkdown(fullReply);
    CHAT_HISTORY.push({role:'assistant', content:fullReply});
  }catch(e){
    div.innerHTML = LANG==='vi'?"Lỗi kết nối. Vui lòng thử lại.":"Connection error. Please try again.";
  }
  setTyping(false);
}

function quickAsk(text){
  document.getElementById('chatInput').value = text;
  sendChat();
}

function normalizeDest(raw){
  const lower = raw.toLowerCase().trim();
  const map = {
    'khach san':'hilton anaheim','hotel':'hilton anaheim','nha nghi':'hilton anaheim',
    'hoi nghi':'anaheim convention center','convention center':'anaheim convention center',
    'trung tam hoi nghi':'anaheim convention center',
    'san bay':'john wayne airport','airport':'john wayne airport','sna':'sna',
    'benh vien':'st joseph hospital','hospital':'st joseph hospital','cap cuu':'uc irvine medical center',
    'nha thuoc':'cvs pharmacy','pharmacy':'cvs pharmacy','cvs':'cvs pharmacy',
    'disney':'disneyland','cong vien':'disneyland',
    'an uong':'anaheim packing district','packing district':'anaheim packing district',
    'pho 79':'pho 79','pho':'pho 79','little saigon':'little saigon',
    'bai bien':'newport beach','beach':'newport beach','newport':'newport beach',
    'downtown disney':'downtown disney','marriott':'anaheim marriott','hilton':'hilton anaheim'
  };
  // Exact match first
  if(map[lower]) return map[lower];
  // Partial fuzzy match
  for(const [vi,en] of Object.entries(map)){
    if(lower.includes(vi)) return en;
  }
  return raw;
}

function handleLost(){
  const rawDest = prompt(LANG==='vi'?"Bạn muốn đến đâu? (ví dụ: khách sạn, sân bay, hội nghị)":"Where do you want to go? (e.g. hotel, airport, convention)");
  if(!rawDest) return;
  const dest = normalizeDest(rawDest);
  addUserMessage(`${T('chatLost')} → ${rawDest}`);

  // If no GPS, fall back to chat
  if(!GPS_LAT || !GPS_LON){
    setTyping(true);
    fetch('/api/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:`Tôi muốn đến ${rawDest}. Chỉ đường cho tôi, và cho tôi biết địa chỉ cụ thể.`, history:CHAT_HISTORY.slice(-6)})
    })
    .then(r=>{
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-bubble bot';
      div.textContent = '';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      let buf = '';
      function readChunk(){
        reader.read().then(({done,value})=>{
          if(done){ setTyping(false); return; }
          buf += decoder.decode(value, {stream:true});
          let nl;
          while((nl=buf.indexOf('\n'))>=0){
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl+1);
            if(!line) continue;
            try{
              const parsed = JSON.parse(line);
              if(parsed.token){ div.textContent += parsed.token; box.scrollTop = box.scrollHeight; }
            }catch(e){}
          }
          readChunk();
        });
      }
      readChunk();
    })
    .catch(e=>{
      addBotMessage(LANG==='vi'?"Lỗi kết nối. Vui lòng thử lại.":"Connection error. Please try again.");
      setTyping(false);
    });
    return;
  }

  setTyping(true);
  fetch('/api/navigate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lat:GPS_LAT, lon:GPS_LON, destination:dest, lang:LANG})
  })
  .then(r=>r.json())
  .then(data=>{
    // Any error from /api/navigate → fallback to streaming chat so chatbot never hangs
    if(data.error){
      addBotMessage(`<b>${T('navTo')} ${rawDest}</b><br><small>${LANG==='vi'?'Không tìm thấy đường đi. Hỏi chatbot...':'No route found. Asking chatbot...'}</small>`);
      fetch('/api/chat/stream', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:`Tôi muốn đến ${rawDest}. Chỉ đường cụ thể từ chỗ tôi đang đứng.`, history:CHAT_HISTORY.slice(-6)})
      })
      .then(r=>{
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        const box = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.textContent = '';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        let buf = '';
        function readChunk(){
          reader.read().then(({done,value})=>{
            if(done){ setTyping(false); return; }
            buf += decoder.decode(value, {stream:true});
            let nl;
            while((nl=buf.indexOf('\n'))>=0){
              const line = buf.slice(0,nl).trim();
              buf = buf.slice(nl+1);
              if(!line) continue;
              try{
                const parsed = JSON.parse(line);
                if(parsed.token){ div.textContent += parsed.token; box.scrollTop = box.scrollHeight; }
              }catch(e){}
            }
            readChunk();
          });
        }
        readChunk();
      })
      .catch(e=>{
        addBotMessage(LANG==='vi'?"Lỗi kết nối. Vui lòng thử lại.":"Connection error. Please try again.");
        setTyping(false);
      });
    } else {
      addBotMessage(data.formatted || "Here are your directions:", [
        {text: T('openGoogleMaps'), fn: ()=> window.open(data.google_maps_url, '_blank')}
      ]);
      if(data.directions && data.directions.steps){
        const steps = data.directions.steps.map((s,i)=>`${i+1}. ${s.instruction} — ${s.distance_text}`).join('<br>');
        addBotMessage(`<b>${T('navTo')} ${rawDest}</b><br><small>${steps}</small>`);
      }
      setTyping(false);
    }
  })
  .catch(e=>{
    addBotMessage(LANG==='vi'?"Lỗi chỉ đường. Thử lại sau.":"Navigation error. Try again later.");
    setTyping(false);
  });
}

function quickNavigate(rawDest){
  const dest = normalizeDest(rawDest);
  addUserMessage(`${T('navTo')} ${rawDest}`);

  // If GPS missing, fall back to chat
  if(!GPS_LAT || !GPS_LON){
    setTyping(true);
    fetch('/api/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:`Chỉ đường đến ${rawDest}. Tôi đang ở gần trung tâm Anaheim.`, history:CHAT_HISTORY.slice(-6)})
    })
    .then(r=>{
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-bubble bot';
      div.textContent = '';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      let buf = '';
      function readChunk(){
        reader.read().then(({done,value})=>{
          if(done){ setTyping(false); return; }
          buf += decoder.decode(value, {stream:true});
          let nl;
          while((nl=buf.indexOf('\n'))>=0){
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl+1);
            if(!line) continue;
            try{
              const parsed = JSON.parse(line);
              if(parsed.token){ div.textContent += parsed.token; box.scrollTop = box.scrollHeight; }
            }catch(e){}
          }
          readChunk();
        });
      }
      readChunk();
    })
    .catch(e=>{
      addBotMessage(LANG==='vi'?"Lỗi kết nối. Vui lòng thử lại.":"Connection error. Please try again.");
      setTyping(false);
    });
    return;
  }

  setTyping(true);
  fetch('/api/navigate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lat:GPS_LAT, lon:GPS_LON, destination:dest, lang:LANG})
  })
  .then(r=>r.json())
  .then(data=>{
    // Any error from /api/navigate → fallback to streaming chat so chatbot never hangs
    if(data.error){
      addBotMessage(`<b>${T('navTo')} ${rawDest}</b><br><small>${LANG==='vi'?'Không tìm thấy đường đi. Hỏi chatbot...':'No route found. Asking chatbot...'}</small>`);
      fetch('/api/chat/stream', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:`Tôi muốn đến ${rawDest}. Chỉ đường cụ thể từ chỗ tôi đang đứng.`, history:CHAT_HISTORY.slice(-6)})
      })
      .then(r=>{
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        const box = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'chat-bubble bot';
        div.textContent = '';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        let buf = '';
        function readChunk(){
          reader.read().then(({done,value})=>{
            if(done){ setTyping(false); return; }
            buf += decoder.decode(value, {stream:true});
            let nl;
            while((nl=buf.indexOf('\n'))>=0){
              const line = buf.slice(0,nl).trim();
              buf = buf.slice(nl+1);
              if(!line) continue;
              try{
                const parsed = JSON.parse(line);
                if(parsed.token){ div.textContent += parsed.token; box.scrollTop = box.scrollHeight; }
              }catch(e){}
            }
            readChunk();
          });
        }
        readChunk();
      })
      .catch(e=>{
        addBotMessage(LANG==='vi'?"Lỗi kết nối. Vui lòng thử lại.":"Connection error. Please try again.");
        setTyping(false);
      });
    } else {
      addBotMessage(data.formatted || `${T('navTo')} ${rawDest}`, [
        {text: T('openGoogleMaps'), fn: ()=> window.open(data.google_maps_url, '_blank')}
      ]);
      if(data.directions && data.directions.steps){
        const steps = data.directions.steps.map((s,i)=>`${i+1}. ${s.instruction} — ${s.distance_text}`).join('<br>');
        addBotMessage(`<b>${T('navTo')} ${rawDest}</b><br><small>${steps}</small>`);
      }
      setTyping(false);
    }
  })
  .catch(e=>{
    addBotMessage(LANG==='vi'?"Lỗi chỉ đường.":"Navigation error.");
    setTyping(false);
  });
}

function toggleHotelTransit(btn, hKey){
  const body = document.getElementById('transit-' + hKey);
  const open = body.classList.toggle('open');
  if(open && body.getAttribute('data-loaded') !== '1'){
    body.setAttribute('data-loaded','1');
    loadHotelTransit(hKey, body);
  }
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function categoryLabel(cat){
  const map = {
    venue:'venuePlaces', airport:'airportPlaces', food:'foodPlaces',
    activity:'activityPlaces', hotel:'hotelPlaces', emergency:'emergencyPlaces', pharmacy:'pharmacyPlaces'
  };
  return T(map[cat] || 'detail');
}

async function loadHotelTransit(hKey, container){
  try{
    const r = await fetch('/api/connections?hotel=' + encodeURIComponent(hKey));
    const data = await r.json();
    const items = data.connections || [];
    if(!items.length){
      container.innerHTML = '<p style="font-size:12px;color:var(--mute)">'+T('noConnections')+'</p>';
      return;
    }
    // Group by category
    const groups = {};
    items.forEach(item=>{
      const c = item.category;
      if(!groups[c]) groups[c] = [];
      groups[c].push(item);
    });
    const order = ['venue','airport','food','activity','hotel','emergency','pharmacy'];
    let htmlOut = '';
    order.forEach(cat=>{
      if(!groups[cat]) return;
      const catName = categoryLabel(cat);
      htmlOut += '<div style="margin-bottom:10px"><h4 style="font-size:12px;color:var(--accent);margin:6px 0 4px">'+escapeHtml(catName)+'</h4>';
      groups[cat].forEach(item=>{
        const name = typeof item.place_name==='object' ? T(item.place_name) : escapeHtml(item.place_name);
        const note = typeof item.transit_note==='object' ? T(item.transit_note) : escapeHtml(item.transit_note);
        htmlOut += '<div style="font-size:12px;color:var(--text);margin-bottom:6px;padding:6px;background:var(--card);border-radius:8px;border:1px solid var(--border)">'
          + '<div style="font-weight:600">'+escapeHtml(name)+'</div>'
          + '<div style="color:var(--mute);margin:2px 0">'+escapeHtml(note)+'</div>'
          + '<a class="btn btn-sm btn-primary" style="margin-top:4px" href="'+escapeHtml(item.google_maps_transit_url)+'" target="_blank">'
          + '<span class="en-show">'+UI.en.byTransit+'</span><span class="vi-show">'+UI.vi.byTransit+'</span></a>'
          + '</div>';
      });
      htmlOut += '</div>';
    });
    container.innerHTML = htmlOut;
  }catch(e){
    container.innerHTML = '<p style="font-size:12px;color:var(--danger)">'+escapeHtml(LANG==='vi'?'Lỗi tải phương tiện.':'Transit load error.')+'</p>';
  }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js').catch(console.error);
}
