# Render Blueprint for myassistant_Anaheim
# To deploy: go to Dashboard → New + → Blueprint → connect this repo
services:
  - type: web
    name: myassistant-anaheim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: FLASK_PORT
        value: $PORT
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
